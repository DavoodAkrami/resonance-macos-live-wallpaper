name: Publish macOS disk image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing GitHub release (for example, v2.2.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-dmg-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Build and verify the universal app
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resonance/Info.plist)"
          [[ "$RELEASE_TAG" == "v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          xcodebuild -project Resonance.xcodeproj -scheme Resonance -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/resonance-build" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
          app="$RUNNER_TEMP/resonance-build/Build/Products/Release/Resonance.app"
          codesign --verify --deep --strict --all-architectures "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/Resonance"

      - name: Package the disk image and checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resonance-dmg-root" "$RUNNER_TEMP/resonance-dist"
          ditto "$RUNNER_TEMP/resonance-build/Build/Products/Release/Resonance.app" \
            "$RUNNER_TEMP/resonance-dmg-root/Resonance.app"
          ln -s /Applications "$RUNNER_TEMP/resonance-dmg-root/Applications"
          cd "$RUNNER_TEMP/resonance-dist"
          dmg="Resonance-${RELEASE_TAG#v}-macOS.dmg"
          hdiutil create -volname "Resonance ${RELEASE_TAG#v}" \
            -srcfolder "$RUNNER_TEMP/resonance-dmg-root" -fs HFS+ -format UDZO "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > SHA256SUMS.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/resonance-dist"
          dmg="Resonance-${RELEASE_TAG#v}-macOS.dmg"
          gh release upload "$RELEASE_TAG" "$dmg" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
